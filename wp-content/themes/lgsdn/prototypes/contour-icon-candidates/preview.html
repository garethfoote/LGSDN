<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contour icon candidates at 26px</title>
<style>
  :root { color-scheme: light; font-family: Arial, sans-serif; color: #27272d; background: #f7f6f1; }
  body { margin: 0; padding: 32px; }
  h1 { margin: 0 0 24px; font-size: 18px; font-weight: 500; }
  .row { display: grid; grid-template-columns: 190px 190px 190px; gap: 20px; }
  article { min-height: 90px; padding: 18px; background: #fffefa; }
  .heading { display: flex; align-items: flex-start; gap: 8px; }
  img { display: block; width: 26px; height: 26px; flex: none; margin-top: 1px; }
  h2 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 400; }
  small { display: block; margin-top: 14px; color: #6b6b70; font-size: 11px; }
</style>
<body>
  <h1>Contour icon candidates · displayed at 26 × 26px</h1>
  <main class="row">
    <article><div class="heading"><img src="join.svg"><h2>Join the network</h2></div><small>Candidate 1</small></article>
    <article><div class="heading"><img src="browse.svg"><h2>Browse the playbook</h2></div><small>Candidate 2</small></article>
    <article><div class="heading"><img src="contribute.svg"><h2>Contribute an example</h2></div><small>Candidate 3</small></article>
  </main>
</body>
</html>
